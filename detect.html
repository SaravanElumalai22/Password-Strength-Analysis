<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Password Strength Checker</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
    body {
        font-family: 'Poppins', sans-serif;
        background: url("https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5") no-repeat center center fixed;
        background-size: cover;
        color: #fff;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        position: relative;
    }

    body::before {
        content: "";
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.78);
        backdrop-filter: blur(3px) saturate(70%);
        z-index: -1;
    }

    .container {
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(15px);
        padding: 80px;
        border-radius: 15px;
        width: 350px;
        text-align: center;
    }

    input, button {
        width: 100%;
        padding: 12px;
        margin-top: 15px;
        border-radius: 8px;
        border: none;
        box-sizing: border-box;
    }

    input {
        outline: none;
    }

    button {
        background: #b72ba9;
        color: white;
        cursor: pointer;
        font-size: 16px;
    }

    button:hover {
        background: #9c2391;
    }

    .back-link {
        display: inline-block;
        margin-top: 15px;
        color: #ffcc00;
        text-decoration: none;
        font-weight: 500;
    }

    .back-link:hover {
        text-decoration: underline;
    }

    /* 🔥 LOADING OVERLAY */
    .loading-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0,0,0,0.85);
        display: none;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        z-index: 9999;
        color: white;
    }

    .spinner {
        width: 60px;
        height: 60px;
        border: 6px solid rgba(255,255,255,0.2);
        border-top: 6px solid #ffcc00;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-bottom: 20px;
    }

    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }

    .loading-text {
        font-size: 20px;
        font-weight: 600;
        letter-spacing: 1px;
    }
</style>
</head>

<body>

<!-- LOADING SCREEN -->
<div class="loading-overlay" id="loading">
    <div class="spinner"></div>
    <div class="loading-text">🔍 Analysing Password...</div>
</div>

<div class="container">
    <h2>🔐 Password Strength Checker</h2>

    <form method="POST" action="{% url 'detect_result' %}" id="form">
        {% csrf_token %}
        <input type="text" name="password" placeholder="Enter password..." required>
        <button type="submit" id="btn">Check Strength</button>
    </form>

    <a href="{% url 'users-home' %}" class="back-link">Go back to Home</a>
</div>

<script>
    const form = document.getElementById("form");
    const loading = document.getElementById("loading");
    const btn = document.getElementById("btn");

    form.addEventListener("submit", function () {
        // show loader
        loading.style.display = "flex";

        // disable button to prevent double submit
        btn.disabled = true;
        btn.innerText = "Analyzing...";
    });
</script>

</body>
</html>
