<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Poppins', sans-serif;
   background: url("https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5") no-repeat center center fixed;
    background-size: cover;
    padding: 40px 20px;
    color: #fff;
}

h2 {
    text-align: center;
    margin-bottom: 30px;
}

/* Card */
#login_form {
    max-width: 450px;
    margin: auto;
    padding: 30px;
    border-radius: 15px;
    background: rgba(255,255,255,0.12);
    backdrop-filter: blur(12px);
    box-shadow: 0 8px 25px rgba(0,0,0,0.3);
}

/* Inputs */
input {
    width: 100%;
    padding: 12px;
    margin: 12px 0;
    border-radius: 8px;
    border: none;
    background: rgba(255,255,255,0.15);
    color: #fff;
}

input:focus {
    outline: none;
    box-shadow: 0 0 10px #00e0ff;
}

/* Labels */
label {
    color: #ffd369;
}

/* Button */
button {
    width: 100%;
    padding: 14px;
    border-radius: 8px;
    border: none;
    background: linear-gradient(45deg, #ff7eb3, #ff4e8a);
    color: white;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    background: linear-gradient(45deg, #00e0ff, #0072ff);
    transform: translateY(-2px);
}

/* Error box */
.alert {
    background: rgba(255,0,0,0.2);
    padding: 10px;
    border-radius: 8px;
    margin-bottom: 15px;
}

/* Footer link */
.card-footer {
    text-align: center;
    margin-top: 20px;
}

.card-footer a {
    color: #ffd369;
}
</style>
</head>

<body>

<h2>🔐 Login</h2>

<div id="login_form">

    {% if form.errors %}
    <div class="alert">
        {% for key, value in form.errors.items %}
            <strong>{{ value }}</strong>
        {% endfor %}
    </div>
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <label>Username</label>
        {{ form.username }}

        <label>Password</label>
        {{ form.password }}

        <div style="margin:10px 0;">
            {{ form.remember_me }} Remember me
        </div>

        <button type="submit">Sign In</button>
    </form>

    <div class="card-footer">
        <a href="{% url 'users-register' %}">Don't have an account? Sign up</a><br>
        <a href="{% url 'users-home' %}">Go back to Home</a>
    </div>

</div>

</body>
</html>
